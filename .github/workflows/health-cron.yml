name: Live Owner Portal Health Watchdog

on:
  push:
    branches: [ main ]
  schedule:
    # Run every 2 hours automatically on GitHub Actions to keep deployment active
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  ping-health:
    name: Keepalive & Health Watchdog
    runs-on: ubuntu-latest

    steps:
      - name: 🩺 Ping Owner Portal Health
        run: |
          echo "Pinging https://bizora-owner.onrender.com..."
          RESPONSE=$(curl -s -L -w "\n%{http_code}" https://bizora-owner.onrender.com)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)

          echo "HTTP Response Code: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
            echo "✅ Bizora Owner Portal is active and healthy!"
          else
            echo "⚠️ Health check returned HTTP $HTTP_CODE"
          fi
