name: CI - Build Verification & Type Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    name: Build & Verify Owner Portal
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🗄️ Generate Prisma database client
        run: npx prisma generate

      - name: 👑 Build Business Owner Portal
        run: npm run build

      - name: ✅ Build Checks Passed
        run: echo "Bizora Owner Portal compiled cleanly with 0 errors!"
